  --bg-elev: #161619;
  --bg-elev2: #202024;
  --bg-elev3: #2a2a2f;
  --fill: rgba(120, 120, 132, 0.22);
  --fill-strong: rgba(120, 120, 132, 0.34);
  --sep: rgba(255, 255, 255, 0.09);
  --glass: rgba(24, 24, 28, 0.72);
  /* ink */
  --label: #f5f5f7;
  --label2: rgba(235, 235, 245, 0.62);
  --label3: rgba(235, 235, 245, 0.36);
  /* accent: Apple Music rose */
  --accent: #fa2d48;
  --accent-soft: rgba(250, 45, 72, 0.16);
  --accent-ink: #ff5a6f;
  --good: #30d158;
  --warn: #ffb340;
  /* chart categorical slots (validated dark steps) */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  /* type */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Figtree", system-ui, "Segoe UI", sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Figtree", system-ui, "Segoe UI", sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, "Figtree", system-ui, sans-serif;
  --t-large: clamp(28px, 4.2vw, 36px);
  --t-title2: 22px;
  --t-title3: 19px;
  --t-body: 15px;
  --t-sub: 13px;
  --t-cap: 11.5px;
  /* shape */
  --r-art: 8px;
  --r-card: 14px;
  --r-sheet: 20px;
  --sidebar: 250px;
  --ease: cubic-bezier(.2, .8, .2, 1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--label);
  font-family: var(--font);
  font-size: var(--t-body);
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  margin: 0;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num, .tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--label2); }
.faint { color: var(--label3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.fill { fill: currentColor; stroke: none; }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100%; }
.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: linear-gradient(180deg, #141417 0%, #111113 100%);
  border-right: 1px solid var(--sep);
  padding: 22px 14px 18px;
  display: flex; flex-direction: column; gap: 4px;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
  background: linear-gradient(145deg, #ff5a6f, #fa2d48 45%, #b3123a); box-shadow: 0 4px 14px rgba(250,45,72,.35); }
.brand-mark svg { width: 17px; height: 17px; color: #fff; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
.nav-label { font-size: var(--t-cap); font-weight: 600; color: var(--label3); text-transform: uppercase; letter-spacing: .06em; padding: 14px 10px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 7px 10px; border-radius: 8px;
  color: var(--label); font-size: 14px; font-weight: 500; border: 0; background: none; width: 100%; text-align: left;
}
.nav-item svg { width: 19px; height: 19px; color: var(--accent); }
.nav-item:hover { background: var(--fill); text-decoration: none; }
.nav-item.active { background: var(--fill-strong); }
.sidebar-foot { margin-top: auto; padding-top: 14px; display: grid; gap: 4px; }
.acct { color: var(--label); text-decoration: none !important; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; }
.acct img, .acct .avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
.acct .avatar { background: var(--bg-elev3); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.acct small { display: block; color: var(--label2); font-size: 12px; }

.main { min-width: 0; position: relative; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 52px;
  display: flex; align-items: center; gap: 12px;
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
  background: var(--glass); backdrop-filter: saturate(180%) blur(24px); -webkit-backdrop-filter: saturate(180%) blur(24px);
  border-bottom: 1px solid transparent; transition: border-color .2s;
}
.topbar.scrolled { border-bottom-color: var(--sep); }
.topbar-title { font-weight: 600; font-size: 15px; opacity: 0; transition: opacity .2s; }
.topbar.scrolled .topbar-title { opacity: 1; }
.topbar .spacer { flex: 1; }
.topbar .mobile-brand { display: none; }
.back-btn { display: inline-flex; align-items: center; gap: 2px; color: var(--accent-ink); background: none; border: 0; font-weight: 500; padding: 4px 6px 4px 0; }
.back-btn svg { width: 20px; height: 20px; }
.page {
  padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
  padding-block: 8px 80px; max-width: 1280px;
}
.large-title { font-family: var(--font-display); font-size: var(--t-large); font-weight: 700; letter-spacing: -0.022em; line-height: 1.1; margin: 6px 0 4px; text-wrap: balance; }
.page-sub { color: var(--label2); margin: 0 0 22px; font-size: 15px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head .large-title { margin-bottom: 2px; }
.page-head .page-sub { margin: 0; }

.tabbar { display: none; }

/* ---------- Sections & shelves ---------- */
.section { margin-top: 34px; }
.section:first-child { margin-top: 0; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; border-top: 1px solid var(--sep); padding-top: 16px; }
.section-head.bare { border-top: 0; padding-top: 0; }
.section-title { font-family: var(--font-display); font-size: var(--t-title2); font-weight: 700; letter-spacing: -0.015em; margin: 0; display: flex; align-items: center; gap: 6px; }
.section-title .chev { width: 18px; height: 18px; color: var(--label3); }
.section-note { color: var(--label2); font-size: var(--t-sub); }
.link-btn { background: none; border: 0; color: var(--accent-ink); font-weight: 500; font-size: 14px; padding: 0; }
.link-btn:hover { text-decoration: underline; }

.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 6px; scrollbar-width: none; }
.shelf::-webkit-scrollbar { display: none; }
.shelf > * { scroll-snap-align: start; min-width: 0; }
.shelf.artists { grid-auto-columns: minmax(130px, 1fr); }

.tile { display: grid; gap: 7px; background: none; border: 0; padding: 0; text-align: left; color: inherit; min-width: 0; }
.tile:hover { text-decoration: none; }
.tile:hover .art { filter: brightness(1.08); }
.tile-title { font-size: 13.5px; font-weight: 500; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-sub { font-size: 12.5px; color: var(--label2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -4px; }
.tile.round { text-align: center; }
.tile.round .art { border-radius: 50%; }

.art {
  position: relative; width: 100%; aspect-ratio: 1; max-width: 100%; border-radius: var(--r-art); overflow: hidden;
  background: var(--bg-elev2); box-shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 6px 18px rgba(0,0,0,.35);
  display: grid; place-items: center; transition: filter .2s;
}
.art img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; opacity: 0; transition: opacity .35s; }
.art img.on { opacity: 1; }
.art .mono { font-family: var(--font-display); font-weight: 700; color: rgba(255,255,255,.92); letter-spacing: -0.02em; font-size: clamp(14px, 3.2vw, 34px); text-shadow: 0 1px 8px rgba(0,0,0,.25); }
.art.sm { width: 44px; height: 44px; border-radius: 6px; box-shadow: none; flex: none; }
.art.sm .mono { font-size: 15px; }
.art.xs { width: 36px; height: 36px; border-radius: 5px; box-shadow: none; flex: none; }
.art.xs .mono { font-size: 13px; }
.art.round { border-radius: 50%; }

/* ---------- Lists ---------- */
.list { display: grid; }
.row {
  display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 12px;
  padding: 7px 8px; border-radius: 8px; min-height: 56px; background: none; border: 0; text-align: left; color: inherit; width: 100%;
}
.row + .row { box-shadow: 0 -1px 0 var(--sep); }
.row:hover { background: var(--fill); box-shadow: none; text-decoration: none; }
.row:hover + .row { box-shadow: none; }
.row .rank { width: 22px; text-align: right; color: var(--label2); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.row .meta { min-width: 0; }
.row .t { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: 12.5px; color: var(--label2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .v { font-size: 13px; color: var(--label2); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.row .v b { color: var(--label); font-weight: 600; }
.row.no-rank { grid-template-columns: auto minmax(0, 1fr) auto; }
.row.check { grid-template-columns: auto auto minmax(0, 1fr) auto; cursor: pointer; }
.row .bar { height: 4px; border-radius: 2px; background: var(--fill); margin-top: 6px; overflow: hidden; }
.row .bar i { display: block; height: 100%; border-radius: 2px; background: var(--accent); }
.cols-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }
.cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
.col-title { font-size: 17px; font-weight: 700; margin: 0 0 8px; display: flex; align-items: center; justify-content: space-between; min-height: 32px; }

/* ---------- Controls ---------- */
.seg { display: inline-flex; background: var(--fill); padding: 2px; border-radius: 9px; gap: 2px; max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--label); white-space: nowrap; }
.seg button.on { background: #636366; box-shadow: 0 3px 8px rgba(0,0,0,.2); }
.seg.lg button { padding: 7px 18px; font-size: 14px; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 22px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: var(--fill); display: grid; place-items: center; }
.stepper button:disabled { opacity: .3; cursor: default; }
.stepper button svg { width: 15px; height: 15px; }
.stepper .lbl { min-width: 150px; text-align: center; font-weight: 600; font-size: 14px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 0; border-radius: 10px;
  padding: 9px 16px; font-size: 14px; font-weight: 600; background: var(--fill); color: var(--label); white-space: nowrap;
}
.btn:hover { background: var(--fill-strong); text-decoration: none; }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.primary:hover { background: #ff4560; }
.btn.tinted { background: var(--accent-soft); color: var(--accent-ink); }
.btn.tinted:hover { background: rgba(250,45,72,.24); }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn.danger { background: rgba(255,69,58,.14); color: #ff6961; }
.btn:disabled { opacity: .4; cursor: default; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.icon-btn { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--fill); display: inline-grid; place-items: center; color: var(--label); flex: none; }
.icon-btn:hover { background: var(--fill-strong); }
.icon-btn svg { width: 17px; height: 17px; }
.icon-btn.accent { color: var(--accent-ink); }

.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--label2); font-weight: 500; }
.input, select.input {
  width: 100%; background: var(--bg-elev2); border: 1px solid var(--sep); border-radius: 10px; padding: 10px 12px; font-size: 14px;
}
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search { position: relative; max-width: 320px; width: 100%; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--label3); width: 16px; height: 16px; }
.search .input { padding-left: 32px; background: var(--fill); border-color: transparent; border-radius: 10px; padding-block: 7px; }
.check-box { width: 22px; height: 22px; border-radius: 50%; border: 1.6px solid var(--label3); display: grid; place-items: center; flex: none; }
.check-box svg { width: 13px; height: 13px; color: #fff; opacity: 0; }
.on > .check-box, .check-box.on { background: var(--accent); border-color: var(--accent); }
.on > .check-box svg, .check-box.on svg { opacity: 1; }
input[type="range"] { accent-color: var(--accent); width: 100%; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 999px; background: var(--fill); font-size: 12.5px; color: var(--label); font-weight: 500; }
.chip.accent { background: var(--accent-soft); color: var(--accent-ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- Cards & stats ---------- */
.card { background: var(--bg-elev); border-radius: var(--r-card); padding: 18px; border: 1px solid var(--sep); min-width: 0; }
.card h3 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
.card .card-sub { color: var(--label2); font-size: 13px; margin: 0 0 14px; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--sep); border-radius: var(--r-card); overflow: hidden; border: 1px solid var(--sep); }
.stat { background: var(--bg-elev); padding: 14px 16px; min-width: 0; }
.stat .k { font-size: 12px; color: var(--label2); font-weight: 500; }
.stat .val { font-family: var(--font-round); font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: 2px; line-height: 1.15; }
.stat .val small { font-size: 14px; color: var(--label2); font-weight: 600; margin-left: 2px; }
.stat .d { font-size: 12px; margin-top: 3px; color: var(--label2); }
.delta-up { color: var(--good); }
.delta-down { color: #ff6961; }

.hero {
  position: relative; border-radius: 22px; overflow: hidden; min-height: 250px; padding: 28px;
  display: flex; flex-direction: column; justify-content: flex-end; isolation: isolate; background: #1a0d12;
}
.hero .bgimg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(46px) saturate(1.5) brightness(.75); transform: scale(1.1); z-index: -2; opacity: 0; transition: opacity .6s; }
.hero .bgimg.on { opacity: 1; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -3;
  background: radial-gradient(120% 90% at 0% 0%, #7a1530 0%, transparent 55%), radial-gradient(90% 90% at 100% 20%, #3b1a6b 0%, transparent 60%), linear-gradient(160deg, #24101a, #0d0d10); }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(0,0,0,0) 20%, rgba(0,0,0,.55) 100%); }
.hero-eyebrow { font-size: 12.5px; font-weight: 600; color: rgba(255,255,255,.75); text-transform: uppercase; letter-spacing: .07em; }
.hero-big { font-family: var(--font-round); font-size: clamp(44px, 8vw, 76px); font-weight: 800; letter-spacing: -0.035em; line-height: 1; margin: 6px 0 4px; font-variant-numeric: tabular-nums; }
.hero-big small { font-size: .32em; font-weight: 700; letter-spacing: -0.01em; color: rgba(255,255,255,.8); margin-left: 6px; }
.hero-line { color: rgba(255,255,255,.82); font-size: 15px; max-width: 60ch; }
.hero-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.hero-stats { display: flex; gap: 26px; flex-wrap: wrap; }
.hero-stats div b { display: block; font-family: var(--font-round); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.hero-stats div span { font-size: 12px; color: rgba(255,255,255,.7); }

.promo { position: relative; border-radius: 18px; overflow: hidden; padding: 20px; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; border: 0; text-align: left; color: #fff; isolation: isolate; }
.promo:hover { text-decoration: none; filter: brightness(1.06); }
.promo .p-eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; opacity: .85; }
.promo .p-title { font-family: var(--font-display); font-size: 26px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
.promo .p-sub { font-size: 13.5px; opacity: .85; }
.promo.wrapped { background: radial-gradient(100% 120% at 0% 100%, #ff375f 0%, transparent 60%), radial-gradient(90% 100% at 100% 0%, #bf5af2 0%, transparent 60%), linear-gradient(135deg, #5e1336, #2a0f45); }
.promo.miles { background: radial-gradient(100% 120% at 100% 100%, #ff9f0a 0%, transparent 55%), radial-gradient(80% 100% at 0% 0%, #ff375f 0%, transparent 60%), linear-gradient(135deg, #4a1d10, #33101c); }
.promo.disc { background: radial-gradient(100% 120% at 0% 0%, #0a84ff 0%, transparent 60%), radial-gradient(100% 100% at 100% 100%, #30d158 0%, transparent 55%), linear-gradient(135deg, #0d2445, #0c2a22); }
.promos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

.empty { border: 1px dashed var(--fill-strong); border-radius: var(--r-card); padding: 28px; text-align: center; color: var(--label2); display: grid; gap: 10px; justify-items: center; }
.empty svg.big { width: 36px; height: 36px; color: var(--label3); }
.empty h3 { color: var(--label); margin: 0; font-size: 17px; }
.empty p { margin: 0; max-width: 46ch; font-size: 14px; }
.note { background: var(--bg-elev); border: 1px solid var(--sep); border-radius: 12px; padding: 12px 14px; font-size: 13.5px; color: var(--label2); display: flex; gap: 10px; align-items: flex-start; }
.note svg { width: 18px; height: 18px; color: var(--accent-ink); margin-top: 1px; }

/* ---------- Charts ---------- */
.chart { width: 100%; display: block; overflow: visible; }
.chart text { fill: var(--label2); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.chart .grid line { stroke: var(--sep); stroke-width: 1; }
.chart .axis-base { stroke: rgba(255,255,255,.18); }
.chart-wrap { position: relative; }
.chart-tip {
  position: absolute; pointer-events: none; z-index: 5; background: rgba(40,40,46,.94); backdrop-filter: blur(10px);
  border: 1px solid var(--sep); border-radius: 9px; padding: 7px 10px; font-size: 12.5px; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .12s;
}
.chart-tip.on { opacity: 1; }
.chart-tip b { font-weight: 600; }
.chart-tip .tk { color: var(--label2); font-size: 11.5px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--label2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.heat { display: grid; gap: 3px; }
.heat-cell { border-radius: 3px; aspect-ratio: 1; }
.cal-wrap { overflow-x: auto; padding-bottom: 4px; }
.scale { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--label3); }
.scale i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

/* ---------- Artist & playlist headers ---------- */
.detail-head { position: relative; display: flex; gap: 28px; align-items: flex-end; padding: 18px 0 26px; isolation: isolate; flex-wrap: wrap; }
.detail-head .bgwash { position: absolute; left: -28px; right: -28px; top: -70px; bottom: 0; z-index: -1; background-size: cover; background-position: center 30%; filter: blur(60px) saturate(1.6) brightness(.55); opacity: 0; transition: opacity .6s; mask-image: linear-gradient(180deg, #000 30%, transparent); -webkit-mask-image: linear-gradient(180deg, #000 30%, transparent); }
.detail-head .bgwash.on { opacity: .9; }
.detail-head .art { width: 220px; max-width: 46vw; flex: none; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
.detail-head .art .mono { font-size: 64px; }
.detail-info { min-width: 0; flex: 1 1 280px; display: grid; gap: 8px; }
.detail-kind { font-size: 12.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--label2); }
.detail-name { font-family: var(--font-display); font-size: clamp(30px, 5.4vw, 54px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; margin: 0; text-wrap: balance; overflow-wrap: anywhere; }

  return `<div class="art ${size} ${round ? 'round' : ''} ${cls}" style="background:${tileGrad(name)}"${k}><span class="mono">${esc(initials(name))}</span>${im}</div>`;

    .replace(/\s*[\(\[].*?(remaster|version|edit|mono|stereo|live|deluxe|feat\.?|ft\.?|with).*?[\)\]]/g, '')
    .replace(/\s+-\s+.*(remaster|version|edit|mono|stereo|live).*$/g, '')

  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }

// spread songs so the same artist doesn't play back to back
function spreadByArtist(items, getArtist) {
  const groups = new Map();
  items.forEach((it) => { const a = getArtist(it); if (!groups.has(a)) groups.set(a, []); groups.get(a).push(it); });

  while (out.length < items.length) {
    const cands = [...groups.entries()].filter(([a, l]) => l.length).sort((x, y) => y[1].length - x[1].length);

    out.push(pick[1].shift()); last = pick[0];
  }
  return out;

const LS = {

const IDB = (() => {
  let dbp = null;

  }

    async get(k) { try { const db = await open(); return await new Promise((res, rej) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch { return undefined; } },

})();

function normalizeRecord(r) {

}

async function importHistoryFiles(files, onProgress = () => {}) {
  const texts = [];
  let i = 0;
  for (const f of files) {
    onProgress(`Reading ${f.name}`, (i++ / files.length) * 0.4);
    if (/\.zip$/i.test(f.name)) texts.push(...(await readZip(f)));
    else if (/\.json$/i.test(f.name)) texts.push({ name: f.name, text: await f.text() });
  }
  if (!texts.length) throw new Error('No listening history found. Choose the .zip from Spotify or the Streaming_History_Audio .json files inside it.');
  const recs = [];

  for (let k = 0; k < texts.length; k++) {
    onProgress(`Parsing ${texts[k].name}`, 0.4 + (k / texts.length) * 0.4);
    await sleep(0);
    let arr; try { arr = JSON.parse(texts[k].text); } catch { skippedFiles.push(texts[k].name); continue; }
    if (!Array.isArray(arr)) { skippedFiles.push(texts[k].name); continue; }

  if (H.loaded) for (let j = 0; j < H.n; j++) {
    const ti = H.tr[j];
    recs.push({ t: H.ts[j], ms: H.ms[j], name: H.tName[ti], artist: H.artists[H.tArtist[ti]], album: H.albums[H.tAlbum[ti]] || '', uri: H.tUri[ti] || '', fl: H.fl[j], pf: H.pf[j], ext: true });

function derive() {

  'user-read-private', 'user-top-read', 'user-read-recently-played', 'user-library-read',
  'playlist-read-private', 'playlist-read-collaborative', 'playlist-modify-private', 'playlist-modify-public',
].join(' ');
const API = 'https://api.spotify.com/v1';

const S = {
  me: null,
  get clientId() { return LS.get('clientId', ''); },
  set clientId(v) { LS.set('clientId', v); },
  get tokens() { return LS.get('tokens', null); },
  set tokens(v) { v ? LS.set('tokens', v) : LS.del('tokens'); },
  get connected() { return !!this.tokens?.refresh_token || !!this.tokens?.access_token; },
  redirectUri() { return location.origin + location.pathname.replace(/index\.html?$/i, ''); },
  canConnect() { return /^https:$/.test(location.protocol) || /^(127\.0\.0\.1|\[::1\])$/.test(location.hostname); },

  async login() {
    if (!this.clientId) throw new Error('Add your Client ID first.');
    const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
    const challenge = b64url(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))));
    const state = uid() + uid();
    LS.set('pkce', { verifier, state, back: location.hash || '#home' });
    const q = new URLSearchParams({ response_type: 'code', client_id: this.clientId, scope: SCOPES, code_challenge_method: 'S256', code_challenge: challenge, redirect_uri: this.redirectUri(), state });
    location.assign('https://accounts.spotify.com/authorize?' + q);
  },
  async handleRedirect() {
    const q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('error')) return null;
    const pk = LS.get('pkce', {}); LS.del('pkce');
    const back = pk.back || '#home';
    history.replaceState(null, '', location.pathname + back);
    if (q.get('error')) return { error: q.get('error') === 'access_denied' ? 'You cancelled the Spotify login.' : 'Spotify login failed: ' + q.get('error') };
    if (!pk.verifier || q.get('state') !== pk.state) return { error: 'The Spotify login could not be verified. Try connecting again.' };
    const body = new URLSearchParams({ grant_type: 'authorization_code', code: q.get('code'), redirect_uri: this.redirectUri(), client_id: this.clientId, code_verifier: pk.verifier });
    const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) return { error: 'Spotify login failed: ' + (j.error_description || j.error || r.status) };
    this.tokens = { ...j, expires_at: Date.now() + (j.expires_in - 60) * 1000 };
    return { ok: true };
  },
  async refresh() {
    const t = this.tokens; if (!t?.refresh_token) throw Object.assign(new Error('Your Spotify session ended. Connect again in Settings.'), { auth: true });
    const body = new URLSearchParams({ grant_type: 'refresh_token', refresh_token: t.refresh_token, client_id: this.clientId });
    const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { this.tokens = null; throw Object.assign(new Error('Your Spotify session ended. Connect again in Settings.'), { auth: true }); }
    this.tokens = { ...t, ...j, refresh_token: j.refresh_token || t.refresh_token, expires_at: Date.now() + (j.expires_in - 60) * 1000 };
  },
  logout() { this.tokens = null; this.me = null; LS.del('meCache'); },

  async api(path, { method = 'GET', body, query, retry = 0 } = {}) {
    let t = this.tokens; if (!t) throw Object.assign(new Error('Connect Spotify first.'), { auth: true });
    if (!t.expires_at || Date.now() > t.expires_at) { await this.refresh(); t = this.tokens; }
    let url = path.startsWith('http') ? path : API + path;
    if (query) url += (url.includes('?') ? '&' : '?') + new URLSearchParams(query);
    const r = await fetch(url, { method, headers: { Authorization: 'Bearer ' + t.access_token, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
    if (r.status === 401 && retry < 1) { await this.refresh(); return this.api(path, { method, body, query, retry: retry + 1 }); }
    if (r.status === 429 && retry < 3) {
      const ra = Math.min(30, parseInt(r.headers.get('Retry-After') || '2', 10) || 2);
      const j = await r.clone().json().catch(() => null);
      if (j?.error?.reason === 'QUOTA_EXCEEDED') throw new Error('Spotify’s daily request limit for your developer app was reached. Try again later.');
      await sleep(ra * 1000); return this.api(path, { method, body, query, retry: retry + 1 });
    }
    if (r.status === 204) return null;
    const j = await r.json().catch(() => null);
    if (!r.ok) {
      const msg = j?.error?.message || r.statusText || 'Request failed';
      const e = new Error(r.status === 403 ? `Spotify refused this request (${msg}). Check that your account is added under User Management in your Spotify developer app.` : `Spotify: ${msg}`);
      e.status = r.status; throw e;
    }
    return j;
  },
  // Follow `next` links. Some development-mode endpoints cap `limit`, so fall back to 10 when a larger page is refused.
  async pages(path, { limit = 50, max = 1000, query = {} } = {}) {
    let out = [], url, first;
    try { first = await this.api(path, { query: { ...query, limit } }); }
    catch (e) { if (e.status === 400 && limit > 10) { limit = 10; first = await this.api(path, { query: { ...query, limit } }); } else throw e; }
    let page = first;
    while (page) {
      const items = page.items || []; out.push(...items);
      if (out.length >= max || !page.next) break;
      page = await this.api(page.next);
    }
    return out.slice(0, max);
  },

  async getMe() { if (this.me) return this.me; const c = LS.get('meCache'); if (c && Date.now() - c.at < 864e5) return (this.me = c.me); this.me = await this.api('/me'); LS.set('meCache', { me: this.me, at: Date.now() }); return this.me; },
  top(type, range = 'short_term', max = 50) { return cached(`top:${type}:${range}`, 15 * 60e3, () => this.pages(`/me/top/${type}`, { query: { time_range: range }, max })); },
  recent() { return cached('recent', 60e3, () => this.api('/me/player/recently-played', { query: { limit: 50 } }).then((j) => j?.items || [])); },
  playlists() { return cached('playlists', 2 * 60e3, () => this.pages('/me/playlists', { max: 500 })); },
  async playlistItems(id) {
    return cached('pl:' + id, 60e3, async () => {
      const raw = await this.pages(`/playlists/${id}/items`, { max: 10000, query: { additional_types: 'track' } });
      return raw.map((x, pos) => {
        const tr = x.item || x.track; if (!tr) return null;
        return { pos, uri: tr.uri, id: tr.id, name: tr.name, artists: (tr.artists || []).map((a) => ({ name: a.name, id: a.id })), artist: (tr.artists || []).map((a) => a.name).join(', '), mainArtist: tr.artists?.[0]?.name || '', album: tr.album?.name || '', img: pickImg(tr.album?.images, 64), imgL: pickImg(tr.album?.images, 300), release: tr.album?.release_date || '', duration: tr.duration_ms || 0, added: x.added_at ? Date.parse(x.added_at) / 1000 : 0, local: !!(x.is_local || tr.is_local), type: tr.type };
      }).filter(Boolean);
    });
  },
  playlist(id) { return this.api(`/playlists/${id}`, { query: { fields: 'id,name,description,images,owner,collaborative,public,external_urls,snapshot_id' } }); },
  async createPlaylist(name, description = '', isPublic = false) {
    const p = await this.api('/me/playlists', { method: 'POST', body: { name, description, public: isPublic } });
    invalidate('playlists'); return p;
  },
  async addItems(id, uris) {
    uris = uris.filter((u) => u && u.startsWith('spotify:track:'));
    for (let i = 0; i < uris.length; i += 100) await this.api(`/playlists/${id}/items`, { method: 'POST', body: { uris: uris.slice(i, i + 100) } });
    invalidate('pl:' + id); invalidate('playlists');
  },
  async replaceItems(id, uris) {
    uris = uris.filter((u) => u && u.startsWith('spotify:track:'));
    await this.api(`/playlists/${id}/items`, { method: 'PUT', body: { uris: uris.slice(0, 100) } });
    for (let i = 100; i < uris.length; i += 100) await this.api(`/playlists/${id}/items`, { method: 'POST', body: { uris: uris.slice(i, i + 100) } });
    invalidate('pl:' + id); invalidate('playlists');
  },
  async removeItems(id, uris, snapshot) {
    const u = [...new Set(uris)];
    for (let i = 0; i < u.length; i += 100) await this.api(`/playlists/${id}/items`, { method: 'DELETE', body: { items: u.slice(i, i + 100).map((uri) => ({ uri })), ...(snapshot ? { snapshot_id: snapshot } : {}) } });
    invalidate('pl:' + id); invalidate('playlists');
  },
  artist(id) { return cached('artist:' + id, 864e5, () => this.api('/artists/' + id)); },
  artistAlbums(id, max = 40) { return cached('albums:' + id, 6 * 3600e3, () => this.pages(`/artists/${id}/albums`, { limit: 10, max, query: { include_groups: 'album,single' } })); },
  albumTracks(id) { return cached('atracks:' + id, 864e5, () => this.pages(`/albums/${id}/tracks`, { limit: 50, max: 200 })); },
  track(id) { return cached('track:' + id, 864e5 * 7, () => this.api('/tracks/' + id)); },
  async search(q, type = 'track', limit = 5) { const j = await this.api('/search', { query: { q, type, limit: Math.min(10, limit) } }); return j?.[type + 's']?.items || []; },
  async findArtist(name) {
    const key = 'fa:' + name.toLowerCase();
    return cached(key, 864e5 * 7, async () => {
      const res = await this.search(`artist:"${name.replace(/"/g, '')}"`, 'artist', 5).catch(() => []);
      const exact = res.find((a) => a.name.toLowerCase() === name.toLowerCase());
      return exact || res[0] || null;
    });
  },
  async findTrack(name, artist) {
    const key = 'ft:' + (name + '|' + artist).toLowerCase();
    return cached(key, 864e5 * 7, async () => {
      const res = await this.search(`track:"${name.replace(/"/g, '')}" artist:"${artist.replace(/"/g, '')}"`, 'track', 3).catch(() => []);
      return res[0] || (await this.search(`${name} ${artist}`, 'track', 3).catch(() => []))[0] || null;
    });
  },
};
function b64url(bytes) { let s = ''; bytes.forEach((b) => (s += String.fromCharCode(b))); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function pickImg(imgs, target = 300) { if (!imgs?.length) return ''; const s = imgs.slice().sort((a, b) => (a.width || 0) - (b.width || 0)); return (s.find((i) => (i.width || 640) >= target) || s[s.length - 1]).url; }

// small in-memory + session cache for API responses
const _mem = new Map();
async function cached(key, ttl, fn) {
  const hit = _mem.get(key);
  if (hit && Date.now() - hit.at < ttl) return hit.p;
  const p = fn();
  _mem.set(key, { at: Date.now(), p });
  try { return await p; } catch (e) { _mem.delete(key); throw e; }
}
function invalidate(key) { _mem.delete(key); }

/* ===== Last.fm (similar artists) ===== */
const LFM = {
  get key() { return LS.get('lastfmKey', ''); },
  set key(v) { LS.set('lastfmKey', v); },
  async call(method, params) {
    if (!this.key) throw new Error('Add a Last.fm API key in Settings.');
    const q = new URLSearchParams({ method, api_key: this.key, format: 'json', autocorrect: '1', ...params });
    const r = await fetch('https://ws.audioscrobbler.com/2.0/?' + q);
    const j = await r.json().catch(() => null);
    if (!r.ok || j?.error) throw new Error('Last.fm: ' + (j?.message || r.status));
    return j;
  },
  similar(artist, limit = 25) { return cached('lfm:sim:' + artist.toLowerCase(), 864e5, () => this.call('artist.getsimilar', { artist, limit }).then((j) => (j?.similarartists?.artist || []).map((a) => ({ name: a.name, match: +a.match || 0 })))); },
  topTracks(artist, limit = 5) { return cached('lfm:top:' + artist.toLowerCase(), 864e5, () => this.call('artist.gettoptracks', { artist, limit }).then((j) => (j?.toptracks?.track || []).map((t) => ({ name: t.name, artist: t.artist?.name || artist, listeners: +t.listeners || 0 })))); },
};

/* --- images.js --- */
/* ===== Artwork resolver (Spotify images, cached on this device) ===== */
const IMG = {
  cache: LS.get('imgs', {}),
  ids: LS.get('artistIds', {}),
  q: [], active: 0, pending: new Map(), io: null,
};
const saveImgCache = debounce(() => {
  const keys = Object.keys(IMG.cache); if (keys.length > 4000) keys.slice(0, keys.length - 4000).forEach((k) => delete IMG.cache[k]);
  LS.set('imgs', IMG.cache); LS.set('artistIds', IMG.ids);
}, 800);
function seedArtist(a) { if (!a?.name) return; const u = pickImg(a.images, 300); if (u) IMG.cache['artist:' + a.name] = u; if (a.id) IMG.ids[a.name] = a.id; saveImgCache(); }
function seedTrack(uri, images) { const u = pickImg(images, 300); if (uri && u) { IMG.cache['track:' + uri] = u; saveImgCache(); } }

async function resolveImage(kind, key) {
  const ck = kind + ':' + key;
  if (ck in IMG.cache) return IMG.cache[ck];
  if (!S.connected) return '';
  if (IMG.pending.has(ck)) return IMG.pending.get(ck);
  const p = (async () => {
    let url = '';
    try {
      if (kind === 'artist') {
        const a = await S.findArtist(key); if (a) { url = pickImg(a.images, 300); if (a.id) IMG.ids[key] = a.id; }
      } else if (key.startsWith('spotify:track:')) {
        const t = await S.track(key.split(':')[2]); url = pickImg(t?.album?.images, 300);
      } else if (key.startsWith('n:')) {
        const [name, artist] = key.slice(2).split('\u0001'); const t = await S.findTrack(name, artist || ''); url = pickImg(t?.album?.images, 300);
      }
      IMG.cache[ck] = url || ''; saveImgCache();
    } catch (e) { if (e.auth) throw e; url = ''; }
    return url;
  })();
  IMG.pending.set(ck, p);
  try { return await p; } finally { IMG.pending.delete(ck); }
}
function trackKey(t) { return t.uri || ('n:' + t.name + '\u0001' + t.artist); }

function pump() {
  while (IMG.active < 3 && IMG.q.length) {
    const el = IMG.q.shift(); if (!el.isConnected) continue;
    IMG.active++;
    resolveImage(el.dataset.art, el.dataset.key).then((u) => { if (u) setArtImg(el, u); }).catch(() => {}).finally(() => { IMG.active--; pump(); });
  }
}
function setArtImg(el, u) {
  if (el.classList.contains('bgimg') || el.classList.contains('bgwash')) { el.style.backgroundImage = `url("${u}")`; el.classList.add('on'); return; }
  if (el.querySelector('img')) return;
  const im = new Image(); im.alt = ''; im.onload = () => im.classList.add('on'); im.src = u; el.appendChild(im);
}
function hydrateArt(root = document) {
  if (!IMG.io) IMG.io = new IntersectionObserver((ents) => ents.forEach((e) => { if (e.isIntersecting) { IMG.io.unobserve(e.target); IMG.q.push(e.target); pump(); } }), { rootMargin: '300px' });
  $$('[data-art]:not([data-hyd])', root).forEach((el) => {
    el.dataset.hyd = '1';
    if (el.querySelector('img')) return;
    const ck = el.dataset.art + ':' + el.dataset.key;
    if (IMG.cache[ck]) { setArtImg(el, IMG.cache[ck]); return; }
    if (ck in IMG.cache || !S.connected) return;
    IMG.io.observe(el);
  });
}

/* --- charts.js --- */
/* ===== Charts (hand-built SVG) ===== */
const SERIES = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)', 'var(--s7)', 'var(--s8)'];
const OTHER_C = 'rgba(235,235,245,.22)';
const heatColor = (v) => (v <= 0 ? 'var(--fill)' : `rgba(250,45,72,${(0.16 + 0.84 * Math.pow(v, 0.75)).toFixed(3)})`);

function niceStep(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function niceScale(v, n = 4) { if (v <= 0) return { max: 1, step: 1, ticks: [0, 1] }; const step = niceStep(v / n); const max = Math.ceil(v / step - 1e-9) * step; const ticks = []; for (let t = 0; t <= max + step / 2; t += step) ticks.push(t); return { max, step, ticks }; }
function niceMax(v) { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }

// Vertical bar chart. items: [{label, value, tip, hl}]
function barChart(items, { width = 900, height = 200, fmt = (v) => fmtN(v), unit = '', labelEvery = 0, color = 'var(--accent)', minBarGap = 2 } = {}) {
  if (!items.length) return '<p class="muted">No listening in this period.</p>';
  const W = width, H = height, padL = 44, padB = 24, padT = 10, padR = 6;
  const sc = niceScale(Math.max(...items.map((d) => d.value))); const max = sc.max;
  const n = items.length, cw = (W - padL - padR) / n;
  const bw = Math.max(1.5, Math.min(38, cw - Math.max(minBarGap, cw * 0.28)));
  const y = (v) => padT + (H - padT - padB) * (1 - v / max);
  const every = labelEvery || Math.ceil(n / Math.max(4, Math.floor(W / 80)));
  let g = '<g class="grid">';
  sc.ticks.forEach((v, k) => { g += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}${k === sc.ticks.length - 1 ? unit : ''}</text>`; });
  g += '</g>';
  let bars = '', labels = '';
  items.forEach((d, i) => {
    const x = padL + i * cw + (cw - bw) / 2, h = Math.max(0, H - padB - y(d.value));
    const r = Math.min(4, bw / 2, h);
    if (h > 0) bars += `<path d="M${x},${H - padB} V${H - padB - h + r} Q${x},${H - padB - h} ${x + r},${H - padB - h} H${x + bw - r} Q${x + bw},${H - padB - h} ${x + bw},${H - padB - h + r} V${H - padB} Z" fill="${d.hl ? 'var(--accent-ink)' : color}" opacity="${d.dim ? 0.45 : 1}"/>`;
    bars += `<rect x="${padL + i * cw}" y="${padT}" width="${cw}" height="${H - padT - padB}" fill="transparent" data-tip="${attr(d.tip || `<b>${esc(d.label)}</b><br>${fmt(d.value)}${unit}`)}"/>`;
    if (i % every === 0) labels += `<text x="${padL + i * cw + cw / 2}" y="${H - 6}" text-anchor="middle">${esc(d.short ?? d.label)}</text>`;
  });
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Bar chart">${g}<line class="axis-base" x1="${padL}" x2="${W - padR}" y1="${H - padB}" y2="${H - padB}"/>${bars}${labels}</svg></div>`;
}

// 24-hour listening clock
function clockChart(hours, { size = 300 } = {}) {
  const max = Math.max(...hours) || 1, c = 150, r0 = 46, r1 = 132;
  const peak = hours.indexOf(Math.max(...hours));
  let wedges = '', ticks = '';
  for (let h = 0; h < 24; h++) {
    const a0 = ((h / 24) * 360 - 90 + 1.6) * (Math.PI / 180), a1 = (((h + 1) / 24) * 360 - 90 - 1.6) * (Math.PI / 180);
    const rr = r0 + (r1 - r0) * Math.sqrt(hours[h] / max);
    const p = (r, a) => `${(c + r * Math.cos(a)).toFixed(2)},${(c + r * Math.sin(a)).toFixed(2)}`;
    const d = `M${p(r0, a0)} L${p(rr, a0)} A${rr},${rr} 0 0 1 ${p(rr, a1)} L${p(r0, a1)} A${r0},${r0} 0 0 0 ${p(r0, a0)} Z`;
    wedges += `<path d="M${p(r0, a0)} L${p(r1, a0)} A${r1},${r1} 0 0 1 ${p(r1, a1)} L${p(r0, a1)} A${r0},${r0} 0 0 0 ${p(r0, a0)} Z" fill="rgba(255,255,255,.04)"/>`;
    wedges += `<path d="${d}" fill="${h === peak ? 'var(--accent-ink)' : 'var(--accent)'}" opacity="${h === peak ? 1 : 0.55 + 0.45 * (hours[h] / max)}" />`;
    wedges += `<path d="M${p(r0, a0)} L${p(r1, a0)} A${r1},${r1} 0 0 1 ${p(r1, a1)} L${p(r0, a1)} Z" fill="transparent" data-tip="${attr(`<b>${fmtHour(h)} – ${fmtHour((h + 1) % 24)}</b><br>${fmtHours(hours[h])} hours`)}"/>`;
  }
  [0, 6, 12, 18].forEach((h) => { const a = ((h / 24) * 360 - 90) * (Math.PI / 180); ticks += `<text x="${c + (r1 + 12) * Math.cos(a)}" y="${c + (r1 + 12) * Math.sin(a) + 4}" text-anchor="middle">${esc(fmtHour(h))}</text>`; });
  return `<div class="chart-wrap" style="max-width:${size}px;margin:auto"><svg class="chart" viewBox="-14 -14 328 328" role="img" aria-label="Listening by hour of day">${wedges}${ticks}<text x="${c}" y="${c - 4}" text-anchor="middle" style="font-size:12px">Peak</text><text x="${c}" y="${c + 14}" text-anchor="middle" style="font-size:15px;font-weight:700;fill:var(--label)">${esc(fmtHour(peak))}</text></svg></div>`;
}

// weekday × hour heatmap (HTML grid)
function dowHourHeat(m) {
  let max = 0; m.forEach((r) => r.forEach((v) => (max = Math.max(max, v))));
  let html = `<div class="chart-wrap"><div class="heat" style="grid-template-columns: 34px repeat(24, minmax(0,1fr));">`;
  for (let d = 0; d < 7; d++) {
    html += `<div style="font-size:11px;color:var(--label2);align-self:center">${esc(WEEKDAYS[d])}</div>`;
    for (let h = 0; h < 24; h++) html += `<div class="heat-cell" style="background:${heatColor(max ? m[d][h] / max : 0)}" data-tip="${attr(`<b>${WEEKDAYS[d]} · ${fmtHour(h)}</b><br>${fmtHours(m[d][h])} hours`)}"></div>`;
  }
  html += `<div></div>`;
  for (let h = 0; h < 24; h++) html += `<div style="font-size:10px;color:var(--label3);text-align:center">${h % 6 === 0 ? esc(fmtHour(h)) : ''}</div>`;
  html += `</div></div>`;
  return html;
}

// Calendar heatmap for a span of days (max ~1 year)
function calendarHeat(daily, a, b, width = 760) {
  const start = new Date(a * 1000); const s0 = new Date(start.getFullYear(), start.getMonth(), start.getDate() - ((start.getDay() + 6) % 7));
  const end = new Date(Math.min(b, (H.last || b) + 86400) * 1000);
  const cells = []; let max = 0;
  for (let d = new Date(s0); d < end; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1)) {
    const key = Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
    const v = daily.get(key) || 0; max = Math.max(max, v);
    cells.push({ d, v, out: d < start });
  }
  const weeks = Math.ceil(cells.length / 7), gap = 3, cs = Math.max(9, Math.min(17, Math.floor((width - 30) / weeks - gap)));
  const W = 30 + weeks * (cs + gap), Hh = 18 + 7 * (cs + gap);
  let svg = '', lastM = -1;
  cells.forEach((c, i) => {
    const w = Math.floor(i / 7), dd = i % 7, x = 30 + w * (cs + gap), y = 18 + dd * (cs + gap);
    if (dd === 0 && c.d.getMonth() !== lastM && c.d.getDate() <= 7) { svg += `<text x="${x}" y="11">${esc(MONTHS[c.d.getMonth()])}</text>`; lastM = c.d.getMonth(); }
    if (c.out) return;
    svg += `<rect x="${x}" y="${y}" width="${cs}" height="${cs}" rx="3" fill="${heatColor(max ? c.v / max : 0)}" data-tip="${attr(`<b>${c.d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}</b><br>${c.v ? fmtLongDur(c.v) : 'No listening'}`)}"/>`;
  });
  [0, 2, 4].forEach((d) => (svg += `<text x="0" y="${18 + d * (cs + gap) + 10}">${esc(WEEKDAYS[d])}</text>`));
  const scale = `<div class="scale" style="margin-top:8px">Less ${[0, .25, .5, .75, 1].map((v) => `<i style="background:${heatColor(v)}"></i>`).join('')} More</div>`;
  return `<div class="cal-wrap chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${Hh}" width="${W}" height="${Hh}" style="width:${W}px;max-width:none" role="img" aria-label="Calendar of daily listening">${svg}</svg></div>${scale}`;
}

// Stacked area of top artists over time
function stackedArea(ev, { width = 900, height = 280, share = false } = {}) {
  if (!ev || ev.buckets.length < 2) return '<p class="muted">Not enough time in this period to show a trend. Pick a longer period.</p>';
  const W = width, Hh = height, padL = 44, padB = 24, padT = 10, padR = 8;
  const n = ev.buckets.length;
  const layers = [...ev.series.map((s, i) => ({ name: s.name, values: s.values, color: SERIES[i] })), { name: 'Everyone else', values: ev.other, color: OTHER_C }];
  const tot = ev.totals;
  const val = (l, k) => (share ? (tot[k] ? l.values[k] / tot[k] : 0) : l.values[k] / 3600000);
  const sc = share ? { max: 1, ticks: [0, .25, .5, .75, 1] } : niceScale(Math.max(...tot.map((t) => t / 3600000))); const maxV = sc.max;
  const x = (k) => padL + (k / (n - 1)) * (W - padL - padR);
  const y = (v) => padT + (Hh - padT - padB) * (1 - v / maxV);
  const base = new Array(n).fill(0);
  let paths = '';
  // draw bottom-up: top artist at bottom
  layers.forEach((l) => {
    const top = base.map((b, k) => b + val(l, k));
    let d = `M${x(0)},${y(top[0])}`;
    for (let k = 1; k < n; k++) { const xm = (x(k - 1) + x(k)) / 2; d += ` C${xm},${y(top[k - 1])} ${xm},${y(top[k])} ${x(k)},${y(top[k])}`; }
    for (let k = n - 1; k >= 0; k--) { if (k === n - 1) d += ` L${x(k)},${y(base[k])}`; else { const xm = (x(k + 1) + x(k)) / 2; d += ` C${xm},${y(base[k + 1])} ${xm},${y(base[k])} ${x(k)},${y(base[k])}`; } }
    paths += `<path d="${d} Z" fill="${l.color}" stroke="var(--bg-elev)" stroke-width="1.2" opacity=".92"/>`;
    for (let k = 0; k < n; k++) base[k] = top[k];
  });
  let g = '<g class="grid">';
  sc.ticks.forEach((v, k) => { g += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/><text x="${padL - 8}" y="${y(v) + 4}" text-anchor="end">${share ? pct(v) : fmtN(v) + (k === sc.ticks.length - 1 ? ' h' : '')}</text>`; });
  g += '</g>';
  const every = Math.ceil(n / Math.max(3, Math.floor(W / 95))); let labels = '', hits = '';
  const cw = (W - padL - padR) / (n - 1);
  ev.buckets.forEach((b, k) => {
    const lab = b.date.getMonth() === 0 || n <= 14 ? (n <= 14 ? MONTHS[b.date.getMonth()] : String(b.date.getFullYear())) : MONTHS[b.date.getMonth()];
    if (k % every === 0) labels += `<text x="${x(k)}" y="${Hh - 6}" text-anchor="middle">${esc(n > 14 && b.date.getMonth() !== 0 && k % every === 0 ? `${MONTHS[b.date.getMonth()]} ’${String(b.date.getFullYear()).slice(2)}` : lab)}</text>`;
    const rows = layers.map((l) => ({ n: l.name, v: l.values[k] })).filter((r) => r.v > 0).sort((p, q) => q.v - p.v).slice(0, 6);
    const tip = `<b>${b.date.toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</b><br>` + rows.map((r) => `${esc(r.n)} · ${fmtHours(r.v)} h`).join('<br>');
    hits += `<rect x="${x(k) - cw / 2}" y="${padT}" width="${cw}" height="${Hh - padT - padB}" fill="transparent" data-tip="${attr(tip)}"/>`;
  });
  const legend = `<div class="legend">${layers.map((l) => `<span><i style="background:${l.color}"></i>${esc(l.name)}</span>`).join('')}</div>`;
  return `<div class="chart-wrap"><svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Top artists over time">${g}${paths}${labels}${hits}</svg></div>${legend}`;
}

// Horizontal bars list

/* tooltip layer */
function initTooltips() {
  const tip = document.createElement('div'); tip.className = 'chart-tip'; document.body.appendChild(tip);
  tip.style.position = 'fixed';
  let cur = null;
  const show = (e) => {
    const t = e.target.closest?.('[data-tip]');
    if (!t) { if (cur) { tip.classList.remove('on'); cur = null; } return; }
    if (t !== cur) { tip.innerHTML = t.getAttribute('data-tip'); cur = t; }
    tip.classList.add('on');
    const x = clamp(e.clientX, 80, window.innerWidth - 80); tip.style.left = x + 'px'; tip.style.top = e.clientY + 'px';
  };
  document.addEventListener('pointermove', show, { passive: true });
  document.addEventListener('pointerdown', show, { passive: true });
  document.addEventListener('scroll', () => { tip.classList.remove('on'); cur = null; }, { passive: true, capture: true });
}

/* charts that need the real container width (crisp text at any size) */
const _slots = new Map();
function chartSlot(build, minHeight = 120) { const id = 'c' + uid(); _slots.set(id, build); return `<div class="chart-slot" data-cid="${id}" style="min-height:${minHeight}px"></div>`; }

/* ===== Shareable cards (canvas → PNG) ===== */
const SHARE_THEMES = [
  ['#ff375f', '#bf5af2', '#2a0f45', '#140814'],
  ['#ff9f0a', '#ff375f', '#4a1d10', '#160a08'],
  ['#0a84ff', '#30d158', '#0d2445', '#06121c'],
  ['#bf5af2', '#5e5ce6', '#1b1050', '#0a0818'],
  ['#ff6482', '#ffd60a', '#5c1d2a', '#170a0c'],

const CARD_FONT = '-apple-system, BlinkMacSystemFont, "SF Pro Display", "Figtree", "Segoe UI", sans-serif';
function loadImg(url) { return new Promise((res) => { if (!url) return res(null); const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = () => res(null); im.src = url; }); }

async function drawShareCard(spec, withImages = true) {

  const blob = (x, y, r, col, a) => { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = a; g.fillStyle = gr; g.fillRect(0, 0, W, Hh); g.globalAlpha = 1; };
  blob(120, 1250, 900, th[0], 0.9); blob(1000, 120, 800, th[1], 0.75); blob(700, 700, 600, th[2], 0.6);
  const vg = g.createLinearGradient(0, 0, 0, Hh); vg.addColorStop(0, 'rgba(0,0,0,0.05)'); vg.addColorStop(1, 'rgba(0,0,0,0.35)'); g.fillStyle = vg; g.fillRect(0, 0, W, Hh);
  // brand
  g.fillStyle = '#fff'; g.font = `700 34px ${CARD_FONT}`; g.textBaseline = 'alphabetic';
  roundRect(g, 80, 74, 52, 52, 13); g.fillStyle = '#fa2d48'; g.fill();
  g.fillStyle = '#fff'; g.font = `800 30px ${CARD_FONT}`; g.fillText('♪', 94, 112);
  g.font = `700 34px ${CARD_FONT}`; g.fillText('Encore', 148, 112);
  g.globalAlpha = .8; g.font = `600 30px ${CARD_FONT}`; g.textAlign = 'right'; g.fillText(spec.period || '', W - 80, 112); g.textAlign = 'left'; g.globalAlpha = 1;
  let y = (!spec.image && !spec.items?.length) ? 470 : 250;
  g.globalAlpha = .85; g.font = `700 34px ${CARD_FONT}`; g.fillText((spec.eyebrow || '').toUpperCase(), 80, y); g.globalAlpha = 1; y += 26;
  if (spec.image && withImages) {
    const im = await loadImg(spec.image);
    if (im) { const s = 380; g.save(); if (spec.round) { g.beginPath(); g.arc(80 + s / 2, y + 30 + s / 2, s / 2, 0, Math.PI * 2); g.clip(); } else { roundRect(g, 80, y + 30, s, s, 26); g.clip(); } g.drawImage(im, 80, y + 30, s, s); g.restore(); y += s + 60; }
  }
  if (spec.big) {
    g.font = `800 ${spec.bigSize || 200}px ${CARD_FONT}`; y += (spec.bigSize || 200) * 0.85;
    fitText(g, spec.big, 80, y, W - 160, spec.bigSize || 200, 800); y += 30;
    if (spec.unit) { g.font = `700 54px ${CARD_FONT}`; y += 50; g.fillText(spec.unit, 80, y); }
  }
  if (spec.title) { y += 90; fitText(g, spec.title, 80, y, W - 160, 84, 800); }
  if (spec.line) { y += 70; g.globalAlpha = .88; g.font = `500 40px ${CARD_FONT}`; y = wrapText(g, spec.line, 80, y, W - 160, 52); g.globalAlpha = 1; }
  if (spec.items?.length) {
    y += 40;
    const imgs = withImages ? await Promise.all(spec.items.map((it) => loadImg(it.image))) : [];
    spec.items.slice(0, 5).forEach((it, k) => {
      const rowY = y + k * 150;
      g.font = `800 54px ${CARD_FONT}`; g.globalAlpha = .9; g.fillText(String(k + 1), 80, rowY + 80); g.globalAlpha = 1;
      let tx = 160;
      if (imgs[k]) { g.save(); if (spec.roundItems) { g.beginPath(); g.arc(160 + 55, rowY + 55, 55, 0, Math.PI * 2); g.clip(); } else { roundRect(g, 160, rowY, 110, 110, 14); g.clip(); } g.drawImage(imgs[k], 160, rowY, 110, 110); g.restore(); tx = 300; }
      g.font = `700 46px ${CARD_FONT}`; fitText(g, it.name, tx, rowY + 52, W - tx - 80, 46, 700);
      g.globalAlpha = .75; g.font = `500 34px ${CARD_FONT}`; fitText(g, it.sub || '', tx, rowY + 98, W - tx - 80, 34, 500); g.globalAlpha = 1;
    });
  }
  g.globalAlpha = .7; g.font = `500 28px ${CARD_FONT}`; g.fillText(spec.footer || 'Made with Encore · my Spotify listening', 80, Hh - 80); g.globalAlpha = 1;
  return c;
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

}

  if (line) g.fillText(line, x, y);

}
async function cardBlob(spec) {
  let c = await drawShareCard(spec, true);
  try { return await new Promise((res, rej) => c.toBlob((b) => (b ? res(b) : rej(new Error('blob'))), 'image/png')); }
  catch { c = await drawShareCard(spec, false); return new Promise((res) => c.toBlob(res, 'image/png')); }
}
async function openShare(spec) {
  const body = `<div class="loading"><div class="spinner"></div>Drawing your card…</div>`;
  const m = openSheet({ title: 'Share', body, foot: '' });
  const blob = await cardBlob(spec);
  const url = URL.createObjectURL(blob);
  const fname = 'encore-' + (spec.title || spec.eyebrow || 'card').toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 40) + '.png';
  const file = new File([blob], fname, { type: 'image/png' });
  const canShare = !!(navigator.canShare && navigator.canShare({ files: [file] }));
  m.body.innerHTML = `<img class="share-preview" src="${url}" alt="Share card preview">`;
  m.foot.innerHTML = `${canShare ? `<button class="btn" data-x="share">${icon('share')}Share…</button>` : ''}<button class="btn primary" data-x="save">${icon('down')}Save image</button>`;
  m.foot.onclick = async (e) => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    if (b.dataset.x === 'save') { const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); toast('Image saved', 'ok'); }
    if (b.dataset.x === 'share') { try { await navigator.share({ files: [file], title: spec.title || 'Encore' }); } catch {} }
  };
}

async function render() {

  $('#topLeft').innerHTML = detail ? `<button class="back-btn" data-act="back">${icon('chevL')}Back</button>` : '';

  $('#topRight').innerHTML = `<a class="icon-btn" href="#settings" aria-label="Settings" style="${r.name === 'settings' ? 'visibility:hidden' : ''}">${icon('gear')}</a>`;

  if (!sameRoute) page.innerHTML = `<div class="loading"><div class="spinner"></div>Loading…</div>`;
  else page.style.minHeight = prevH + 'px';

}

/* ---- sheets ---- */
function openSheet({ title, body = '', foot = '', wide = false, onClose } = {}) {
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet ${wide ? 'wide' : ''}" tabindex="-1" role="dialog" aria-modal="true" aria-label="${attr(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-close aria-label="Close">${icon('x')}</button></div><div class="sheet-body"></div><div class="sheet-foot"></div></div>`;
  const b = $('.sheet-body', scrim), f = $('.sheet-foot', scrim);

  scrim.addEventListener('click', (e) => { if (e.target === scrim || e.target.closest('[data-close]')) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(scrim);

  obs.observe(f, { childList: true, subtree: true });

function periodToolbar({ allowAll = true, kinds = ['week', 'month', 'year'] } = {}) {
  const p = App.period;
  const opts = kinds.map((k) => [k, k[0].toUpperCase() + k.slice(1)]); if (allowAll) opts.push(['all', 'All time']);
  const canPrev = p.kind !== 'all' && periodHasData(shiftPeriod(p, -1));
  const canNext = p.kind !== 'all' && periodHasData(shiftPeriod(p, 1));
  return `${seg('periodKind', opts, p.kind)}${p.kind !== 'all' ? `<div class="stepper"><button data-act="period" data-dir="-1" aria-label="Previous" ${canPrev ? '' : 'disabled'}>${icon('chevL')}</button><span class="lbl">${esc(periodLabel(p))}</span><button data-act="period" data-dir="1" aria-label="Next" ${canNext ? '' : 'disabled'}>${icon('chevR')}</button></div>` : ''}`;
}
// previous period, cut to the same length when the current one is still in progress
function comparablePrev(p) {
  const pp = prevPeriod(p); if (!pp || !periodHasData(pp)) return null;
  const [a, b] = periodRange(p); let [pa, pb] = periodRange(pp);
  if (b > H.last + 1) pb = Math.min(pb, pa + (H.last + 1 - a));
  if (pa < H.first) return null;
  return aggregate(pa, pb);
}
function deltaText(cur, prev) {
  if (!prev) return '';
  const d = (cur - prev) / prev;
  return `<div class="d ${d >= 0 ? 'delta-up' : 'delta-down'}">${d >= 0 ? '▲' : '▼'} ${pct(Math.abs(d))} vs previous</div>`;
}
function bucketFor(p) {
  if (p.kind === 'week' || p.kind === 'month') return 'day';
  if (p.kind === 'year') return 'month';
  return (H.last - H.first) > 86400 * 365 * 3 ? 'year' : 'month';
}
function bucketLabel(b, bucket) {
  if (bucket === 'day') return { label: b.date.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' }), short: String(b.date.getDate()) };
  if (bucket === 'month') return { label: b.date.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }), short: MONTHS[b.date.getMonth()] };
  if (bucket === 'week') return { label: 'Week of ' + b.date.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }), short: b.date.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) };
  return { label: String(b.date.getFullYear()), short: String(b.date.getFullYear()) };
}

function playedSetsForArtist() {

}
async function liveKnownTracks() {
  const lists = await Promise.all([...['short_term', 'medium_term', 'long_term'].map((r) => S.top('tracks', r, 50).catch(() => [])), S.recent().then((r) => r.map((x) => x.track)).catch(() => [])]);
  return lists.flat().filter(Boolean);
}
async function deepCuts(name, { maxAlbums = 6, max = 30, sets } = {}) {
  const a = IMG.ids[name] ? { id: IMG.ids[name] } : await S.findArtist(name);
  if (!a?.id) return [];
  sets = sets || playedSetsForArtist();
  if (!H.loaded) (await liveKnownTracks()).forEach((t) => { sets.uris.add(t.uri); sets.names.add(normTitle(t.name) + '|' + (t.artists?.[0]?.name || '').toLowerCase()); });
  const albums = (await S.artistAlbums(a.id, 40)).filter((al) => al.album_type !== 'compilation');
  albums.sort((x, y) => (x.album_type === y.album_type ? (y.release_date || '').localeCompare(x.release_date || '') : x.album_type === 'album' ? -1 : 1));
  const out = []; const seenNames = new Set();
  for (const al of albums.slice(0, maxAlbums)) {
    const tracks = await S.albumTracks(al.id).catch(() => []);
    for (const t of tracks) {
      if (!t.artists?.some((x) => x.id === a.id)) continue;
      const nk = normTitle(t.name) + '|' + name.toLowerCase();
      if (sets.uris.has(t.uri) || sets.names.has(nk) || seenNames.has(normTitle(t.name))) continue;
      seenNames.add(normTitle(t.name));
      out.push({ name: t.name, artist: (t.artists || []).map((x) => x.name).join(', '), mainArtist: name, album: al.name, uri: t.uri, img: pickImg(al.images, 300), duration: t.duration_ms, release: al.release_date });
      if (out.length >= max) return out;
    }
  }
  return out;
}

async function resolveUris(tracks, onProgress) {
  const out = []; let k = 0;
  for (const t of tracks) {
    k++;
    if (t.uri && t.uri.startsWith('spotify:track:')) { out.push(t.uri); continue; }
    onProgress?.(`Finding “${t.name}” on Spotify`, k / tracks.length);
    const f = await S.findTrack(t.name, t.mainArtist || t.artist).catch(() => null);
    if (f?.uri) out.push(f.uri);
  }
  return [...new Set(out)];
}
async function savePlaylist({ name, description = '', tracks, isPublic = false, onProgress }) {
  const uris = await resolveUris(tracks, onProgress);
  if (!uris.length) throw new Error('None of these songs could be found on Spotify.');
  onProgress?.('Creating the playlist', 0.9);
  const p = await S.createPlaylist(name, description, isPublic);
  await S.addItems(p.id, uris);
  return { playlist: p, count: uris.length };
}

  if (keys.length) { const span = keys[keys.length - 1] - keys[0]; const byYear = span > 36; const m = new Map(); keys.forEach((k) => { const kk = byYear ? Math.floor(k / 12) : k; m.set(kk, (m.get(kk) || 0) + added.get(k)); }); const lo = byYear ? Math.floor(keys[0] / 12) : keys[0], hi = byYear ? Math.floor(keys[keys.length - 1] / 12) : keys[keys.length - 1]; for (let k = lo; k <= hi; k++) addedSeries.push({ label: byYear ? String(k) : `${MONTHS[k % 12]} ${Math.floor(k / 12)}`, short: byYear ? String(k) : MONTHS[k % 12], value: m.get(k) || 0 }); }

      <div class="cols-2"><div><div class="col-title">Most played here</div><div class="list">${most.map((t, i) => trackRow(t, { rank: i + 1, img: t.img, value: `<b>${fmtN(t.p.plays)}</b> plays` })).join('')}</div></div>
      <div><div class="col-title">Never played</div>${never.length ? `<div class="list">${never.slice(0, 5).map((t) => trackRow(t, { img: t.img, value: fmtDur(t.duration) })).join('')}</div>${never.length > 5 ? `<p class="muted" style="font-size:13px">and ${fmtN(never.length - 5)} more</p>` : ''}` : '<p class="muted">You’ve played every song here.</p>'}</div></div></section>`;
  }

      <div class="stat"><div class="k">Songs</div><div class="val">${fmtN(items.length)}</div></div>
      <div class="stat"><div class="k">Length</div><div class="val" style="font-size:22px">${fmtLongDur(dur)}</div></div>
      <div class="stat"><div class="k">Artists</div><div class="val">${fmtN(artists.size)}</div></div>
      <div class="stat"><div class="k">Average song</div><div class="val">${fmtDur(dur / items.length)}</div></div>
    </div>
    <section class="section"><div class="cols-2">
      <div class="card"><h3>Who's on it</h3><p class="card-sub">Songs per artist</p>${hbarList(topA.map(([a, n]) => ({ labelHtml: `<a href="#artist/${encodeURIComponent(a)}" style="color:inherit">${esc(a)}</a>`, value: n })), { fmt: (v) => plural(v, 'song') })}</div>

/* clean up */
let _cleanSel = new Set();
function plClean(items) {
  // duplicates: same uri, or same normalized title + main artist
  const groups = new Map();
  items.forEach((t) => { const k = normTitle(t.name) + '|' + t.mainArtist.toLowerCase(); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); });
  const dups = [...groups.values()].filter((g) => g.length > 1);
  const skipped = H.loaded ? items.map((t) => ({ t, p: playsOf(t) })).filter((x) => x.p.ev >= 4 && x.p.skips / x.p.ev >= 0.6) : [];
  const local = items.filter((t) => t.local);

  const row = (t, why) => `<div class="row check ${_cleanSel.has(t.pos) ? 'on' : ''}" data-act="clean-toggle" data-pos="${t.pos}"><span class="check-box">${icon('check')}</span>${art({ name: t.album, img: t.img, size: 'sm' })}<div class="meta"><div class="t">${esc(t.name)}</div><div class="s">${esc(t.artist)} · ${esc(t.album)}</div></div><div class="v">${why}</div></div>`;
  const sections = [];
  sections.push(`<section class="section">${sectionHead('Duplicates', { bare: true, note: dups.length ? `${plural(dups.length, 'song')} appear more than once. Extra copies are selected.` : '' })}${dups.length ? `<div class="list">${dups.map((g) => g.map((t, i) => row(t, i === 0 ? '<span class="chip">Keep</span>' : `#${t.pos + 1}`)).join('')).join('')}</div>` : `<p class="muted">No duplicates. Nice and tidy.</p>`}</section>`);
  if (H.loaded) sections.push(`<section class="section">${sectionHead('Songs you usually skip', { note: 'Skipped in at least 60% of your listens' })}${skipped.length ? `<div class="list">${skipped.map((x) => row(x.t, `skipped ${pct(x.p.skips / x.p.ev)}`)).join('')}</div>` : '<p class="muted">You don’t skip anything here often.</p>'}</section>`);

}

function splitGroups(items) {

  else if (App.plSplit === 'artist') { const c = new Map(); items.forEach((t) => c.set(t.mainArtist, (c.get(t.mainArtist) || 0) + 1)); items.forEach((t) => add(c.get(t.mainArtist) >= 5 ? t.mainArtist : 'Everyone else', t)); }
  else { const n = App.plChunk; for (let i = 0; i < items.length; i += n) m.set(`Part ${i / n + 1}`, items.slice(i, i + n)); }
  return [...m.entries()].sort((a, b) => (App.plSplit === 'chunks' ? 0 : App.plSplit === 'artist' ? (a[0] === 'Everyone else') - (b[0] === 'Everyone else') || b[1].length - a[1].length : a[0].localeCompare(b[0])));
}

/* ---- Smart playlist generator ---- */
const SEASONS = [['winter', 'Winter'], ['spring', 'Spring'], ['summer', 'Summer'], ['autumn', 'Autumn']];
function seasonRange(y, s) {
  const r = { winter: [new Date(y - 1, 11, 1), new Date(y, 2, 1)], spring: [new Date(y, 2, 1), new Date(y, 5, 1)], summer: [new Date(y, 5, 1), new Date(y, 8, 1)], autumn: [new Date(y, 8, 1), new Date(y, 11, 1)] }[s];

}
const GEN_TEMPLATES = [
  { id: 'year', label: 'Top of a year', hist: true },

  { id: 'repeat', label: 'On repeat' },
  { id: 'forgotten', label: 'Forgotten favorites', hist: true },
  { id: 'artist', label: 'Artist mix', hist: true },
  { id: 'finish', label: 'Never skipped', hist: true },
  { id: 'night', label: 'Late night', hist: true },
  { id: 'spotify', label: 'Spotify top songs', live: true },
];
async function genTracks(g) {
  const n = g.len;
  if (g.template === 'spotify' || (g.template === 'repeat' && !H.loaded)) {
    const r = g.template === 'repeat' ? 'short_term' : g.range;
    const tt = await S.top('tracks', r, 50); return { tracks: tt.map(liveTrack).slice(0, n), name: g.template === 'repeat' ? 'On repeat' : `My top songs · ${LIVE_RANGES.find((x) => x[0] === r)[1].toLowerCase()}` };
  }
  if (!H.loaded) return { tracks: [], name: '' };
  if (g.template === 'year') { const [a, b] = periodRange({ kind: 'year', y: g.year }); return { tracks: topTracks(aggregate(a, b), n), name: `My top songs of ${g.year}` }; }
  if (g.template === 'season') { const [a, b] = seasonRange(g.year, g.season); const label = SEASONS.find((s) => s[0] === g.season)[1]; return { tracks: topTracks(aggregate(a, b), n), name: `${label} ${g.year}` }; }
  if (g.template === 'repeat') return { tracks: topTracks(aggregate(H.last - 30 * 86400, H.last + 1), n), name: 'On repeat' };
  if (g.template === 'forgotten') return { tracks: forgottenLoves(n), name: 'Forgotten favorites' };
  if (g.template === 'finish') return { tracks: skipStats(ALL()).alwaysFinish.slice(0, n).concat(topTracks(ALL(), n * 3).filter((t) => t.skips === 0)).filter((t, i, a) => a.findIndex((x) => x.i === t.i) === i).slice(0, n), name: 'Never skipped' };
  if (g.template === 'night') return { tracks: playsInWindow((h) => h >= 23 || h < 4).slice(0, n), name: 'After midnight' };
  if (g.template === 'artist') {
    const names = g.artists.filter((a) => H.artistIndex.has(a)); if (!names.length) return { tracks: [], name: 'Artist mix' };
    const all = ALL(); const per = Math.ceil(n / names.length);
    const picks = names.flatMap((a) => { const x = H.artistIndex.get(a); const ts = []; for (let t = 0; t < H.tCount; t++) if (H.tArtist[t] === x && all.trPlays[t]) ts.push(trackObj(t, all)); return ts.sort((p, q) => q.plays - p.plays).slice(0, per); });
    return { tracks: spreadByArtist(picks, (t) => t.artist).slice(0, n), name: names.length === 1 ? `Best of ${names[0]}` : `${names.slice(0, 3).join(', ')}${names.length > 3 ? ' & more' : ''} mix` };
  }
  return { tracks: [], name: '' };
}

      ${cfg ? `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${cfg}</div>` : ''}

      <div class="field"><label for="gName">Name</label><input class="input" id="gName" value="${attr(g.name)}"></div>
      <div id="gPrev"><div class="loading"><div class="spinner"></div>Picking songs…</div></div></div>`;
    try {
      last = await genTracks(g);
      if (!g.nameTouched) { g.name = last.name; $('#gName', m.el).value = g.name; }
      const tracks = last.tracks.filter((t) => !g.excluded.has(trackKey(t)));
      $('#gPrev', m.el).innerHTML = tracks.length ? `<div class="muted" style="font-size:13px;margin-bottom:6px">${plural(tracks.length, 'song')} · tap × to leave one out</div><div class="list">${tracks.map((t, i) => `<div class="row"><span class="rank">${i + 1}</span>${t.img ? art({ name: t.album || t.name, img: t.img, size: 'xs' }) : art({ kind: 'track', name: t.album || t.name, key: trackKey(t), size: 'xs' })}<div class="meta"><div class="t">${esc(t.name)}</div><div class="s">${esc(t.artist)}</div></div><button class="icon-btn" data-ex="${attr(trackKey(t))}" aria-label="Leave out ${attr(t.name)}" style="width:28px;height:28px">${icon('x')}</button></div>`).join('')}</div>`
        : `<p class="muted">${g.template === 'artist' ? 'Add one or more artists to build a mix.' : 'Nothing to add for this choice.'}</p>`;
      hydrateArt($('#gPrev', m.el));
    } catch (e) { $('#gPrev', m.el).innerHTML = `<div class="note">${icon('info')}<span>${esc(e.message)}</span></div>`; }
  };
  m.body.addEventListener('click', (e) => {
    const t = e.target.closest('[data-tpl]'); if (t) { g.template = t.dataset.tpl; g.excluded.clear(); g.nameTouched = false; draw(); return; }
    const sg = e.target.closest('[data-act="seg"]'); if (sg) { e.stopPropagation(); e.preventDefault(); if (sg.dataset.name === 'gSeason') g.season = sg.dataset.v; if (sg.dataset.name === 'gRange') g.range = sg.dataset.v; g.nameTouched = false; draw(); return; }
    const rm = e.target.closest('[data-rm]'); if (rm) { g.artists = g.artists.filter((a) => a !== rm.dataset.rm); g.nameTouched = false; draw(); return; }
    const ex = e.target.closest('[data-ex]'); if (ex) { g.excluded.add(ex.dataset.ex); ex.closest('.row').remove(); }
  }, true);
  m.body.addEventListener('change', (e) => {
    if (e.target.id === 'gYear') { g.year = +e.target.value; g.nameTouched = false; draw(); }
    if (e.target.id === 'gLen') { g.len = +e.target.value; draw(); }
    if (e.target.id === 'gArtist') { const v = e.target.value.trim(); const hit = topArtistNames.find((a) => a.toLowerCase() === v.toLowerCase()); if (hit && !g.artists.includes(hit)) { g.artists.push(hit); g.nameTouched = false; draw(); } else if (v) toast('Pick an artist from your history'); }
  });
  m.body.addEventListener('input', (e) => { if (e.target.id === 'gName') { g.name = e.target.value; g.nameTouched = true; } if (e.target.id === 'gLen') e.target.nextElementSibling.textContent = `${e.target.value} songs`; });
  m.foot.onclick = (e) => {
    if (!e.target.closest('[data-x="save"]')) return;
    const tracks = last.tracks.filter((t) => !g.excluded.has(trackKey(t)));
    if (!tracks.length) { toast('No songs to save yet'); return; }
    m.close(); openSavePlaylist(tracks, g.name || last.name || 'Encore mix');
  };
  draw();
}

async function seedArtists(n = 6) {
  if (H.loaded) {
    const agg = aggregate(H.last - 180 * 86400, H.last + 1);
    let top = topArtists(agg, n, 'ms'); if (top.length < n) top = topArtists(ALL(), n, 'ms');
    return top.map((a) => a.name);
  }
  if (S.connected) { const t = await S.top('artists', 'medium_term', 20).catch(() => []); t.forEach(seedArtist); return t.slice(0, n).map((a) => a.name); }
  return [];
}
function knownArtistSet() {
  const s = new Set(); if (H.loaded) { const all = ALL(); for (let x = 0; x < H.artists.length; x++) if (all.artPlays[x] >= 3) s.add(H.artists[x].toLowerCase()); }
  return s;
}

async function loadSimilarAll() {
  const box = $('#simAll'); if (!box) return;
  try {
    const seeds = await seedArtists(6);
    if (!seeds.length) { box.innerHTML = '<p class="muted">Listen to a few artists first.</p>'; return; }
    const known = knownArtistSet(); seeds.forEach((s) => known.add(s.toLowerCase()));
    if (S.connected && !H.loaded) (await S.top('artists', 'long_term', 50).catch(() => [])).forEach((a) => known.add(a.name.toLowerCase()));
    const score = new Map();
    const results = await Promise.all(seeds.map((s) => LFM.similar(s, 30).then((l) => ({ s, l })).catch(() => ({ s, l: [] }))));
    results.forEach(({ s, l }, si) => l.forEach((a) => { if (known.has(a.name.toLowerCase())) return; const cur = score.get(a.name) || { name: a.name, score: 0, because: [] }; cur.score += a.match * (1 - si * 0.08); cur.because.push(s); score.set(a.name, cur); }));
    const recs = [...score.values()].sort((a, b) => b.score - a.score).slice(0, 18);
    if (!recs.length) { box.innerHTML = '<p class="muted">Last.fm had no new suggestions. You may have heard them all.</p>'; return; }
    box.innerHTML = `<div class="year-cards" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))">${recs.map((r) => artistTile(r, { sub: `Like ${r.because.slice(0, 2).join(' & ')}` })).join('')}</div>
      <div class="btn-row" style="margin-top:16px"><button class="btn primary" data-act="disc-mix">${icon('wand')}Build a discovery playlist</button></div><div id="discMix"></div>`;
    box.dataset.recs = JSON.stringify(recs.map((r) => r.name));
    hydrateArt(box);
  } catch (e) { box.innerHTML = `<div class="note">${icon('info')}<span>${esc(e.message)}</span></div>`; }
}
