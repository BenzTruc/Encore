  if (d.bigDay) S1.push({ html: `<div class="st-eyebrow">Your biggest day</div><div class="st-title">${esc(fmtDate(dayToSec(d.bigDay.d), { weekday: 'long', day: 'numeric', month: 'long' }))}</div><div class="st-big" style="font-size:clamp(44px,12vw,72px)">${esc(fmtLongDur(d.bigDay.ms))}</div><div class="st-text">${d.bigDayTop ? `On repeat that day: “${esc(d.bigDayTop.name)}” by ${esc(d.bigDayTop.artist)}.` : ''}</div>`, share: { eyebrow: 'My biggest listening day', period: label, title: fmtDate(dayToSec(d.bigDay.d), { weekday: 'long', day: 'numeric', month: 'long' }), line: `${fmtLongDur(d.bigDay.ms)} of music${d.bigDayTop ? ` · on repeat: ${d.bigDayTop.name}` : ''}`, theme: 1 } });
  S1.push({ html: `<div class="st-eyebrow">${esc(label)} · Encore Wrapped</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px 14px;margin-top:8px">
        <div><div class="st-eyebrow" style="font-size:12px">Top artists</div>${d.artists.slice(0, 5).map((a, i) => `<div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${i + 1} ${esc(a.name)}</div>`).join('')}</div>
        <div><div class="st-eyebrow" style="font-size:12px">Top songs</div>${d.tracks.slice(0, 5).map((t, i) => `<div style="font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${i + 1} ${esc(t.name)}</div>`).join('')}</div>
        <div><div class="st-eyebrow" style="font-size:12px">Minutes</div><div class="st-big" style="font-size:40px">${fmtN(d.ms / 60000)}</div></div>
        <div><div class="st-eyebrow" style="font-size:12px">Type</div><div style="font-weight:800;font-size:24px;line-height:1.1">${esc(d.persona.title)}</div></div>
      </div>`, share: { eyebrow: 'My Wrapped', period: label, items: d.artists.slice(0, 5).map((a) => ({ name: a.name, sub: `${fmtN(a.ms / 60000)} minutes`, image: aImg(a.name) })), roundItems: true, line: '', theme: 4 } });
  return S1;
}
function buildLiveSlides(label, ta, tt) {
  const sl = [];
  const g = new Map(); ta.forEach((a, i) => (a.genres || []).forEach((x) => g.set(x, (g.get(x) || 0) + (20 - i))));
  const genres = [...g.entries()].sort((x, y) => y[1] - x[1]).slice(0, 5).map((x) => x[0]);
  sl.push({ html: `<div class="st-eyebrow">Encore snapshot</div><div class="st-title" style="font-size:clamp(40px,11vw,62px)">Your music, ${esc(label.toLowerCase())}</div><div class="st-text">Straight from Spotify. Tap to begin.</div>`, share: { eyebrow: 'Encore snapshot', period: label, big: '♪', bigSize: 240, line: 'My music right now', theme: 0 } });
  const a0 = ta[0];
  sl.push({ html: `${art({ name: a0.name, img: pickImg(a0.images, 640), round: true, cls: 'st-art round' })}<div class="st-eyebrow">Your top artist</div><div class="st-title">${esc(a0.name)}</div>${a0.genres?.length ? `<div class="st-text">${esc(a0.genres.slice(0, 3).join(' · '))}</div>` : ''}`, share: { eyebrow: 'My top artist', period: label, image: pickImg(a0.images, 640), round: true, title: a0.name, line: a0.genres?.slice(0, 3).join(' · ') || '', theme: 2 } });
  sl.push({ html: `<div class="st-eyebrow">Your top artists</div><div class="st-list">${ta.slice(0, 5).map((a, i) => stLi(i + 1, a.name, a.genres?.[0] || '', art({ name: a.name, img: pickImg(a.images, 160), round: true }))).join('')}</div>`, share: { eyebrow: 'My top artists', period: label, items: ta.slice(0, 5).map((a) => ({ name: a.name, sub: a.genres?.[0] || '', image: pickImg(a.images, 300) })), roundItems: true, theme: 3 } });
  if (tt[0]) sl.push({ html: `${art({ name: tt[0].album, img: tt[0].img, cls: 'st-art' })}<div class="st-eyebrow">Your top song</div><div class="st-title">${esc(tt[0].name)}</div><div class="st-text">${esc(tt[0].artist)}</div>`, share: { eyebrow: 'My top song', period: label, image: tt[0].img, title: tt[0].name, line: tt[0].artist, theme: 4 } });
  if (tt.length > 1) sl.push({ html: `<div class="st-eyebrow">Your top songs</div><div class="st-list">${tt.slice(0, 5).map((t, i) => stLi(i + 1, t.name, t.artist, art({ name: t.album, img: t.img }))).join('')}</div>`, share: { eyebrow: 'My top songs', period: label, items: tt.slice(0, 5).map((t) => ({ name: t.name, sub: t.artist, image: t.img })), theme: 1 } });
  if (genres.length) sl.push({ html: `<div class="st-eyebrow">Your sound</div><div style="display:grid;gap:6px">${genres.map((x, i) => `<div class="st-title" style="font-size:${Math.max(24, 46 - i * 5)}px;opacity:${1 - i * 0.12}">${esc(x)}</div>`).join('')}</div>`, share: { eyebrow: 'My sound', period: label, items: genres.map((x) => ({ name: x, sub: '' })), theme: 0 } });
  return sl;
}

/* ---- Story player ---- */
function openStory(slides) {
  let i = 0, timer = null, start = 0, paused = false, elapsed = 0;
  const DUR = 7000;
  const el = document.createElement('div'); el.className = 'story';
  el.innerHTML = `<div class="story-frame"><div class="story-bars">${slides.map(() => '<i><b></b></i>').join('')}</div>
    <div class="story-top"><div class="brandline"><span class="brand-mark" style="width:22px;height:22px;border-radius:6px">${icon('note')}</span>Encore</div><button class="icon-btn" data-x="close" aria-label="Close">${icon('x')}</button></div>
    <div class="story-stage"></div><div class="story-nav"><button aria-label="Previous" data-x="prev"></button><button aria-label="Next" data-x="next"></button></div>
    <div class="story-share"><button class="btn" data-x="share">${icon('share')}Share this</button></div></div>`;
  document.body.appendChild(el); document.body.style.overflow = 'hidden';
  const stage = $('.story-stage', el), bars = $$('.story-bars i', el);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const show = () => {
    bars.forEach((b, k) => { b.classList.toggle('done', k < i); $('b', b).style.width = k < i ? '100%' : '0'; });
    stage.innerHTML = `<div class="story-slide"><div class="story-bg ${reduce ? '' : 'anim'}" style="background:${storyBg(i)}"></div>${slides[i].html}</div>`;
    hydrateArt(stage);
    $$('[data-count]', stage).forEach((c) => { if (reduce) return; const to = +c.dataset.count; const t0 = performance.now(); const step = (t) => { const p = Math.min(1, (t - t0) / 1200); c.textContent = fmtN(to * (1 - Math.pow(1 - p, 3))); if (p < 1 && c.isConnected) requestAnimationFrame(step); }; requestAnimationFrame(step); });
    elapsed = 0; start = performance.now(); tick();
  };
  const tick = () => {
    cancelAnimationFrame(timer);
    const loop = (t) => {
      if (!el.isConnected) return;
      if (!paused) { const p = Math.min(1, (elapsed + t - start) / DUR); $('b', bars[i]).style.width = p * 100 + '%'; if (p >= 1) { next(); return; } }
      timer = requestAnimationFrame(loop);
    };
    timer = requestAnimationFrame(loop);
  };
  const next = () => { if (i < slides.length - 1) { i++; show(); } else { $('b', bars[i]).style.width = '100%'; paused = true; } };
  const prev = () => { if (i > 0) i--; paused = false; show(); };
  const close = () => { cancelAnimationFrame(timer); el.remove(); document.body.style.overflow = ''; document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); paused = false; next(); } if (e.key === 'ArrowLeft') prev(); };
  document.addEventListener('keydown', onKey);
  let downAt = 0;
  el.addEventListener('pointerdown', (e) => { if (e.target.closest('.story-nav')) { downAt = performance.now(); paused = true; elapsed += performance.now() - start; } });
  el.addEventListener('pointerup', () => { if (downAt) { start = performance.now(); paused = false; } });
  el.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]'); if (!b) return;
    const held = downAt && performance.now() - downAt > 350; downAt = 0;
    if (b.dataset.x === 'close') close();
    else if (b.dataset.x === 'share') { paused = true; elapsed += performance.now() - start; openShare(slides[i].share); }
    else if (held) return;
    else if (b.dataset.x === 'next') { paused = false; next(); }
    else if (b.dataset.x === 'prev') prev();
  });
  show();
}

/* ---- Milestones ---- */
VIEWS.milestones = {
  title: 'Milestones',
  async render() {
    const head = `<div class="page-head"><div><h1 class="large-title">Milestones</h1><p class="page-sub">The moments that shaped your listening.</p></div></div>`;
    if (!H.loaded) return head + needHistory('your milestones');
    const ev = milestones();
    const big = ev.filter((e) => e.big);
    const byYear = new Map(); ev.forEach((e) => { const y = new Date(e.t * 1000).getFullYear(); if (!byYear.has(y)) byYear.set(y, []); byYear.get(y).push(e); });
    const specOf = (e) => () => ({ eyebrow: 'Milestone', period: fmtDate(e.t), image: e.artist ? IMG.cache['artist:' + e.artist] : '', round: true, title: e.title, line: e.sub, theme: hashStr(e.title) });
    return `${head}
      ${big.length ? `<div class="promos">${big.map((e, k) => `<div class="promo ${['wrapped', 'miles', 'disc'][k % 3]}"><div class="p-eyebrow">${esc(fmtDate(e.t))}</div><div><div class="p-title">${esc(e.title)}</div><div class="p-sub">${esc(e.sub)}</div></div></div>`).join('')}</div>` : ''}
      <div class="tl">${[...byYear.entries()].map(([y, list]) => `<div class="tl-year">${y}</div>${list.map((e) => `<div class="tl-item"><div class="tl-ic" style="background:${e.color}">${icon(e.icon)}</div><div style="min-width:0"><div class="tl-t">${e.artist ? `<a href="#artist/${encodeURIComponent(e.artist)}" style="color:inherit">${esc(e.title)}</a>` : esc(e.title)}</div><div class="tl-s">${esc(e.sub)}</div></div><div style="display:grid;justify-items:end;gap:6px"><div class="tl-d">${esc(fmtDate(e.t))}</div>${(() => { const id = 'sh' + uid(); SHARE_SPECS.set(id, specOf(e)); return `<button class="icon-btn" style="width:28px;height:28px" data-act="share" data-spec="${id}" aria-label="Share">${icon('share')}</button>`; })()}</div></div>`).join('')}`).join('')}</div>`;
  },
};
